<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="#hero">Portfolio</a>
    <button
      class="site-menu-toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMenu()"
    >
      Menu
    </button>
    <nav
      id="primary-navigation"
      class="site-nav"
      aria-label="Primary navigation"
      [class.site-nav--open]="isMenuOpen()"
    >
      <ul class="site-nav__list">
        <li><a href="#hero" (click)="closeMenu()">Home</a></li>
        <li><a href="#about" (click)="closeMenu()">About</a></li>
        <li><a href="#engineering-focus" (click)="closeMenu()">Engineering Focus</a></li>
        <li><a href="#projects" (click)="closeMenu()">Projects</a></li>
        <li><a href="#skills" (click)="closeMenu()">Skills</a></li>
        <li><a href="#experience" (click)="closeMenu()">Experience</a></li>
        <li><a href="#education" (click)="closeMenu()">Education</a></li>
        <li><a href="#contact" (click)="closeMenu()">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
